name: 'RCE Kunstcollecties ETL: stateful harvest + transform' 

env:
  BASE_URI: 'https://linkeddata.cultureelerfgoed.nl/'
  CACHE_PATH: 'data/'
  GRAPH_ID: 'rijkscollectie-latest-graph'
  DATASET_NAME: 'rijkscollectie-rce'

on:
  workflow_dispatch:
    inputs:
      chunks:
        description: 'Number of records per upload.'
        required: true
        type: number
        default: 7000
    
jobs:
  harvest-and-transform:
    runs-on: ubuntu-latest 
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - uses: actions/cache@v6
      with:
        path: ${{ env.CACHE_PATH }}
        key: ${{ env.DATASET_NAME }}-data-cache-${{ github.run_attempt }}
    - name: print cache status
      run: ls -R
    - name: Clear data/output cache
      run: |
        rm -f ${{ env.CACHE_PATH }}/*
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run functional tests
      run: |
        python -m pytest tests/
    - name: Harvest and transform 
      run: |
        python src/harvest_service.py --chunks ${{ inputs.chunks }} 
    
  push-to-triply:
    runs-on: ubuntu-latest
    needs: harvest-and-transform
    steps:
    - uses: actions/cache@v6
      with:
        path: ${{ env.CACHE_PATH }}
        key: ${{ env.DATASET_NAME }}-data-cache-${{ github.run_attempt }}
    - name: Install dependencies
      run: |
        wget 'https://static.triply.cc/cli/triplydb-linux'
        chmod +x triplydb-linux
    - name: Push changes to TriplyDB API via CLI
      run: |
        d=$(date +%s)
        for file in ${{ env.CACHE_PATH }}*.jsonld; do ./triplydb-linux import-from-file --dataset "${{ env.DATASET_NAME }}" --token "${{ secrets.LDV_API_TOKEN }}" --account "rce" --url "https://api.linkeddata.cultureelerfgoed.nl" --default-graph-name "https://linkeddata.cultureelerfgoed.nl/rce/${{ env.DATASET_NAME }}/graphs/rijkscollectie_$d" --mode "merge" "$file"; done
    - name: Print triply error response
      if: ${{ failure() }}
      run: |
        cat .triplydb-js.err

  sync-triply:
    runs-on: ubuntu-latest
    needs: push-to-triply
    steps:
    - name: Sync changes to TriplyDB API via cURL
      run:  |
        curl -H 'Authorization: Bearer ${{ secrets.LDV_API_TOKEN }}' -H 'Content-Type: application/json' -X POST 'https://api.linkeddata.cultureelerfgoed.nl/datasets/rce/${{ env.DATASET_NAME }}/services/${{ env.DATASET_NAME }}' -d '{"sync": "true"}'