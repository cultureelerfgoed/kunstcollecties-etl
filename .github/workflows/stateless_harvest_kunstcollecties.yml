name: 'RCE Kunstcollecties ETL: stateless harvest' 

env:
  BASE_URI: 'https://linkeddata.cultureelerfgoed.nl/'
  ARTIFACT_PATH: 'artifact.tar.gz'
  GRAPH_ID: 'kunstcollecties-latest-graph'
  DATASET_NAME: 'kunstcollecties-harvest'

on:
  workflow_dispatch:
    inputs:
      chunks:
        description: 'Number of records per upload.'
        required: true
        type: number
        default: 8000
      modification:
        description: 'Harvested records must have been modified on or after supplied ISO-8601 date.'
        required: false
        type: string
        default: '1970-01-01'     
    
jobs:
  etl:
    runs-on: ubuntu-latest 
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Harvest and transform 
      run: |
        python src/harvest_service.py --chunks ${{ inputs.chunks }}
        tar cvf - *.jsonld | gzip -9 - > ${{ env.ARTIFACT_PATH }}
      env:
        MODIFIED_ON_OR_AFTER: ${{ inputs.modification }}
    - name: Compress
      run: |
        tar cvf - *.jsonld | gzip -9 - > ${{ env.ARTIFACT_PATH }}  
    - name: Install dependencies
      run: |
        wget 'https://static.triply.cc/cli/triplydb-linux'
        chmod +x triplydb-linux
        tar -xzvf ${{ env.ARTIFACT_PATH }}
    - name: Push changes to TriplyDB API via CLI
      run: |
        for file in *.jsonld; do ./triplydb-linux import-from-file --dataset "${{ env.DATASET_NAME }}" --token "${{ secrets.LDV_API_TOKEN }}" --account "rce" --url "https://api.linkeddata.cultureelerfgoed.nl" --default-graph-name "https://linkeddata.cultureelerfgoed.nl/rce/${{ env.DATASET_NAME }}/graphs/${{ env.GRAPH_ID }}" --mode "merge" "$file"; done
    - name: Print triply error response
      if: ${{ failure() }}
      run: |
        cat .triplydb-js.err
    - name: Sync changes to TriplyDB API via cURL
      run:  |
        curl -H 'Authorization: Bearer ${{ secrets.LDV_API_TOKEN }}' -H 'Content-Type: application/json' -X POST https://api.linkeddata.cultureelerfgoed.nl/datasets/rce/${{ env.DATASET_NAME }}/services/kunstcollecties-harvest -d '{"sync": "true"}'