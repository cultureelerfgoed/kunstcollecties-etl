name: 'RCE Kunscollecties ETL' 

env:
  BASE_URI: 'https://linkeddata.cultureelerfgoed.nl/'
  ARTIFACT_PATH: 'artifact-data.jsonld'
  GRAPH_ID: 'kunstcollecties-latest-graph'
  DATASET_NAME: 'kunstcollecties-harvest'

on:
  workflow_dispatch:
    
jobs:
  harvest-and-transform:
    runs-on: ubuntu-latest 
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Harvest and transform 
      run: |
        python src/workflow.py   
    - name: Upload data artifact
      uses: actions/upload-artifact@v7
      with:
        name: data-artifact
        path: ${{ env.ARTIFACT_PATH }}
        overwrite: true

  push-to-triply:
    runs-on: ubuntu-latest
    needs: harvest-and-transform
    steps:
    - name: Download data artifact
      uses: actions/download-artifact@v8
      with:
          name: data-artifact
    - name: Push changes to TriplyDB API via cURL
      run:  |
        curl -H 'Authorization: Bearer ${{ secrets.LDV_API_TOKEN }}' -H 'Content-Type: application/ld+json' -X POST 'https://api.linkeddata.cultureelerfgoed.nl/datasets/rce/${{ env.DATASET_NAME }}/jobs'  -F file='${{ env.ARTIFACT_PATH }}'
    - name: Install dependencies
      run: |
        wget 'https://static.triply.cc/cli/triplydb-linux'
        chmod +x triplydb-linux
    - name: Push changes to TriplyDB API via CLI
      run: |
        ./triplydb-linux import-from-file --dataset "${{ env.DATASET_NAME }}" --token "${{ secrets.LDV_API_TOKEN }}" --account "rce" --url "https://api.linkeddata.cultureelerfgoed.nl" --default-graph-name "https://linkeddata.cultureelerfgoed.nl/rce/${{ env.DATASET_NAME }}/graphs/${{ env.GRAPH_ID }}" --mode "overwrite" ${{ env.ARTIFACT_PATH }} 

  sync-triply:
    runs-on: ubuntu-latest
    needs: push-to-triply
    steps:
    - name: Push changes to TriplyDB API via cURL
      run:  |
        curl -H 'Authorization: Bearer ${{ secrets.LDV_API_TOKEN }}' -H 'Content-Type: application/json' -X POST https://api.linkeddata.cultureelerfgoed.nl/datasets/rce/${{ env.DATASET_NAME }}/services/datacatalog -d '{"sync": "true"}'
