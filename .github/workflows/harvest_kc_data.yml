name: 'RCE Kunscollecties ETL TEST' 

env:
  BASE_URI: 'https://linkeddata.cultureelerfgoed.nl/'
  ARTIFACT_PATH: 'artifact-data.jsonld'
  GRAPH_ID: 'kunstcollecties-latest-graph'
  DATASET_NAME: 'kunstcollecties-harvest'

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Set a limit for the amount of records to harvest (0 for no limit).'
        required: true
        default: 0
        type: number
    
jobs:
  harvest-and-transform:
    runs-on: ubuntu-latest 
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Harvest and transform 
      run: |
        python src/workflow.py  
      env:
        LIMIT: ${{ inputs.limit }} 
    - name: Upload data artifact
      uses: actions/upload-artifact@v7
      with:
        name: data-artifact
        path: ${{ env.ARTIFACT_PATH }}
        overwrite: true
